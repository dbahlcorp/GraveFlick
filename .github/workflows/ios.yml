name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Build, sign, and upload build 7 to TestFlight"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify generated animation assets
        run: |
          python3 -m venv "$RUNNER_TEMP/graveflick-assets"
          "$RUNNER_TEMP/graveflick-assets/bin/python" -m pip install --disable-pip-version-check -r Scripts/requirements.txt
          "$RUNNER_TEMP/graveflick-assets/bin/python" Scripts/prepare_animation_atlases.py --root . --verify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          find_iphone() {
            xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; candidates=[device for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")]; print(candidates[0]["udid"] if candidates else "")'
          }
          DEVICE_ID=$(find_iphone)
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator is installed; downloading the iOS simulator platform."
            xcodebuild -downloadPlatform iOS
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; runtimes=[runtime for runtime in json.load(sys.stdin)["runtimes"] if runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; print(runtimes[-1]["identifier"] if runtimes else "")')
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; types=[device for device in json.load(sys.stdin)["devicetypes"] if device["name"].startswith("iPhone")]; print(types[0]["identifier"] if types else "")')
            if [ -z "$RUNTIME_ID" ] || [ -z "$DEVICE_TYPE" ]; then
              echo "::error::Unable to locate an iOS runtime or iPhone device type after platform download"
              exit 1
            fi
            DEVICE_ID=$(xcrun simctl create "GraveFlick CI iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using iPhone simulator $DEVICE_ID"
      - name: Build and run tests
        run: >-
          xcodebuild test
          -project GraveFlick.xcodeproj
          -scheme GraveFlick
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight build 7
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: graveflick-testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: "7"
    steps:
      - uses: actions/checkout@v4
      - name: Validate release secrets
        shell: bash
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify release identity
        run: |
          BUNDLE_ID=$(xcodebuild -project GraveFlick.xcodeproj -scheme GraveFlick \
            -showBuildSettings | awk '$1 == "PRODUCT_BUNDLE_IDENTIFIER" { print $3; exit }')
          echo "Release bundle identifier: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.bahlcorp.graveflick" ]; then
            echo "::error::Expected com.bahlcorp.graveflick"
            exit 1
          fi
      - name: Archive, sign, and upload
        run: bundle exec fastlane ios beta
      - name: Upload signed archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GraveFlick-TestFlight-7
          path: |
            build/GraveFlick.ipa
            build/GraveFlick.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 14
