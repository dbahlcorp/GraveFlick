name: GraveFlick
options:
  bundleIdPrefix: com.bahlcorp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: GPKK39R82X
targets:
  GraveFlick:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bahlcorp.graveflick
        PRODUCT_NAME: GraveFlick
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_ENTITLEMENTS: GraveFlick.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GraveFlick-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GraveFlick
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.action-games
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # `xcodebuild archive` (the TestFlight release build) signs using the Xcode project's own
        # settings, not fastlane's `export_options` — that only governs the later IPA export step.
        # Left on Xcode's automatic-signing default, the archive step tries to resolve its own
        # Development profile instead of the App Store profile `match` installs, which is what was
        # failing. Scoped to Release only so Debug/simulator builds (local dev, CI tests) are
        # unaffected and keep automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.bahlcorp.graveflick"
    scheme:
      testTargets:
        - GraveFlickTests
  GraveFlickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: GraveFlick
